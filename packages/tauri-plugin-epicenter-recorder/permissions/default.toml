"$schema" = "schemas/schema.json"

# Granting this to a window lets it record into a folder the folder plugin
# granted it. It does not choose a folder: a window reaches only the scopes
# the shell registered for its label.
[default]
description = "Record from a microphone into a folder this window was granted, stop or cancel that recording, and repair recordings a quit cut off."
permissions = [
  "allow-start",
  "allow-stop",
  "allow-cancel",
  "allow-recover",
]
