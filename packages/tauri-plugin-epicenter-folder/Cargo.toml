[package]
name = "tauri-plugin-epicenter-folder"
version = "0.0.1"
description = "One native owner per Epicenter folder, shared by every window of a shell"
authors = ["Epicenter"]
repository = "https://github.com/EpicenterHQ/epicenter"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
links = "tauri-plugin-epicenter-folder"

[workspace]
members = ["core"]

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
epicenter-folder-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
specta = "=2.0.0-rc.26"
specta-typescript = "=0.0.13"
glob = "0.3"
serde_json = "1"
tauri = "2.11"
tauri-specta = { git = "https://github.com/specta-rs/tauri-specta", rev = "0922b06408f9dc9ed443589639b067adcef62ba4", features = ["derive", "typescript"] }

[dev-dependencies]
# The mock runtime drives the real invoke handler in tests. Test builds only.
tauri = { version = "2.11", features = ["test"] }

# Tests hash and commit 64 MiB of audio; an unoptimized digest dominates them.
[profile.dev.package.sha2]
opt-level = 3

# The same pins as apps/epicenter/src-tauri/Cargo.toml. They apply when this
# crate is built on its own; a shell that depends on it carries its own copy.
[patch.crates-io]
specta = { git = "https://github.com/specta-rs/specta", rev = "3c535739ea7bd8737ecdbff6c3aef9b7330da706" }
specta-macros = { git = "https://github.com/specta-rs/specta", rev = "3c535739ea7bd8737ecdbff6c3aef9b7330da706" }
specta-serde = { git = "https://github.com/specta-rs/specta", rev = "3c535739ea7bd8737ecdbff6c3aef9b7330da706" }
specta-typescript = { git = "https://github.com/specta-rs/specta", rev = "3c535739ea7bd8737ecdbff6c3aef9b7330da706" }
specta-util = { git = "https://github.com/specta-rs/specta", rev = "3c535739ea7bd8737ecdbff6c3aef9b7330da706" }
