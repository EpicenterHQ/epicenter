[package]
name = "tauri-plugin-epicenter-folder"
version = "0.0.1"
description = "The desktop shell's binding of one existing Epicenter folder to each window that edits it"
authors = ["Epicenter"]
repository = "https://github.com/EpicenterHQ/epicenter"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
links = "tauri-plugin-epicenter-folder"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
dunce = "1"
epicenter-folder-core = { path = "core" }
log = "0.4"
notify = "8"
serde = { version = "1", features = ["derive"] }
specta = "=2.0.0-rc.26"
specta-typescript = "=0.0.13"
percent-encoding = "2"
serde_json = "1"
sha2 = "0.10"
tauri = "2.12"
tauri-plugin-dialog = "2"
# Opens `epicenter://init?…` for `sync_with_epicenter`, from Rust only.
tauri-plugin-opener = "2.5"
tauri-specta = { git = "https://github.com/specta-rs/tauri-specta", rev = "0922b06408f9dc9ed443589639b067adcef62ba4", features = ["derive", "typescript"] }

[dev-dependencies]
tempfile = "3.8"
# The mock runtime drives the real invoke handler in tests. Test builds only.
tauri = { version = "2.12", features = ["test"] }
