# The folder grant without Tauri: scopes, the cross-process lock, the path
# rule, and the checked file changes and `git` runs a page asks for. Its tests
# need only `git` and Bun, so they run without building a webview runtime.
# The plugin crate one directory up adds the IPC commands.
[package]
name = "epicenter-folder-core"
version = "0.0.1"
description = "The desktop shell's grant of an Epicenter folder: scopes, the lock, checked file changes, and guarded Git"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
# Resolves a root to a plain drive path on Windows, not a `\\?\` one.
dunce = "1"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
specta = { version = "=2.0.0-rc.26", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
# Kills a cancelled `git` with the helpers it started (`page_git`).
libc = "0.2"

[dev-dependencies]
serde_json = "1"
