"$schema" = "schemas/schema.json"

# Granting this to a window lets it call the plugin. It names no folder: a
# page reaches the roots the shell named at startup, by name.
[default]
description = "Open the roots the shell named (Data and AppData), show the path the shell named each at, read and change their files through the shell, and ask Epicenter to sync them."
permissions = [
  "allow-open-root",
  "allow-list-folder",
  "allow-read-folder-file",
  "allow-put-folder-file",
  "allow-sync-with-epicenter",
  "allow-synced-with-epicenter",
]
