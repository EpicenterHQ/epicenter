"$schema" = "schemas/schema.json"

# Granting this to a window lets it call the plugin. It does not choose a
# folder: a window reaches only the scope the shell registered for its label.
[default]
description = "Ask for the folder the shell registered for this window, then change its files and run its Git through the shell."
permissions = [
  "allow-grant-directory",
  "allow-run-git",
  "allow-cancel-git",
  "allow-write-folder-file",
  "allow-rename-folder-path",
  "allow-remove-folder-path",
  "allow-make-folder-directory",
]
