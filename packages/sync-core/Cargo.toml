# Spike: one Rust sync core (libgit2 and Git LFS over HTTP) for every native
# host. Its own workspace, excluded from the root one, so the spike's lockfile
# and target directory stay apart from the shipping apps.
[workspace]
resolver = "2"
members = [".", "napi"]

[package]
name = "epicenter-sync-core"
version = "0.0.1"
description = "One sync round for an Epicenter folder: commit, fetch, first contact, merge, LFS, push"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
# HTTPS through the platform TLS (Secure Transport on Apple targets), no SSH.
git2 = { version = "0.20", default-features = false, features = ["https", "vendored-libgit2"] }
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
