						);
						row.setAttr('content', content);
						table.setAttr(`n${i}`, row);
						bodies.push(content);
					}
				});
				let pending;
				doc2.on('updateV2', (update2) => {
					pending = update2;
				});
				let at = 0;
				return {
					doc: doc2,
					edit() {
						pending = undefined;
						const body = bodies[at % bodies.length];
						at += 1;
						if (body !== undefined) {
							doc2.transact(() => body.insert(body.length, 'more words here '));
						}
						return pending ?? new Uint8Array();
					},
				};
			}
			var address = 0;
			async function backing() {
				address += 1;
				const name = `port-cost/${address}`;
				const { data, error: error2 } = await openIdbBacking(name);
				if (error2 !== null) throw new Error(String(error2.message));
				return { ...data, name };
			}
			async function reopen(name) {
				const { data, error: error2 } = await openIdbBacking(name);
				if (error2 !== null) throw new Error(String(error2.message));
				return data;
			}
			async function ackWidth() {
				say(`
## ack cost by how many owed rows it stamps  (syncs: true)`);
				say('  owed rows      append batch          ack        per row');
				for (const owed of [10, 50, 200, 1000, 4000]) {
					const store = await backing();
					const { edit: edit2 } = workspace(200, 120);
					let id3 = 1;
					const ops = [];
					for (let i = 0; i < owed; i += 1) {
						ops.push({
							kind: 'append',
							id: id3++,
							bytes: edit2(),
							authoritySeq: undefined,
						});
					}
					const appendStart = performance.now();
					await store.port.commit(ops);
					const appendMs = performance.now() - appendStart;
					const ackStart = performance.now();
					await store.port.commit([
						{ kind: 'ack', throughId: id3 - 1, authoritySeq: owed },
					]);
					const ackMs = performance.now() - ackStart;
					store.close();
					say(
						`  ${String(owed).padStart(9)}   ${ms(appendMs).padStart(12)}   ${ms(ackMs).padStart(10)}   ${(ackMs / owed).toFixed(3)} ms`,
					);
				}
			}
			async function openCost() {
				say(`
## open cost by chain length  (syncs: true, nothing folded)`);
				say('  chain rows      reopen      hydrate       total');
				for (const rows of [10, 64, 250, 1000, 4000]) {
					const store = await backing();
					const { edit: edit2 } = workspace(200, 120);
					let id3 = 1;
					const ops = [];
					for (let i = 0; i < rows; i += 1) {
						ops.push({
							kind: 'append',
							id: id3++,
							bytes: edit2(),
							authoritySeq: undefined,
						});
					}
					await store.port.commit(ops);
					store.close();
					const openStart = performance.now();
					const again = await reopen(store.name);
					const openMs = performance.now() - openStart;
					const hydrateStart = performance.now();
					const rebuilt = new Doc({ gc: true });
					for (const update2 of again.loaded.updates)
						applyUpdateV2(rebuilt, update2, null);
					const hydrateMs = performance.now() - hydrateStart;
					again.close();
					say(
						`  ${String(rows).padStart(10)}   ${ms(openMs).padStart(9)}   ${ms(hydrateMs).padStart(10)}   ${ms(openMs + hydrateMs).padStart(9)}`,
					);
				}
			}
			async function batching() {
				say(`
## append cost by batch size  (60 appends, syncs: true)`);
				say('  per commit     commits         total     per append');
				for (const batch of [1, 5, 25, 60]) {
					const store = await backing();
					const { edit: edit2 } = workspace(200, 120);
					let id3 = 1;
					let ops = [];
					let commits = 0;
					const start = performance.now();
					for (let i = 0; i < 60; i += 1) {
						ops.push({
							kind: 'append',
							id: id3++,
							bytes: edit2(),
							authoritySeq: undefined,
						});
						if (ops.length === batch) {
							await store.port.commit(ops);
							ops = [];
							commits += 1;
						}
					}
					if (ops.length > 0) {
						await store.port.commit(ops);
						commits += 1;
					}
					const total = performance.now() - start;
					store.close();
					say(
						`  ${String(batch).padStart(10)}   ${String(commits).padStart(7)}   ${ms(total).padStart(11)}   ${(total / 60).toFixed(3)} ms`,
					);
				}
			}
			async function foldCost() {
				say(`
## the commit that folds  (syncs: false, threshold 64)`);
				say('  document        fold commit    plain commit');
				for (const [notes, words] of [
					[200, 120],
					[800, 300],
					[2500, 400],
				]) {
					const store = await backing();
					const { doc: doc2, edit: edit2 } = workspace(notes, words);
					const size2 = encodeStateAsUpdateV2(doc2).byteLength;
					let id3 = 1;
					await store.port.commit([
						{
							kind: 'append',
							id: id3++,
							bytes: new Uint8Array(encodeStateAsUpdateV2(doc2)),
							authoritySeq: undefined,
						},
					]);
					for (let i = 0; i < 61; i += 1) {
						await store.port.commit([
							{
								kind: 'append',
								id: id3++,
								bytes: edit2(),
								authoritySeq: undefined,
							},
						]);
					}
					const plainStart = performance.now();
					await store.port.commit([
						{
							kind: 'append',
							id: id3++,
							bytes: edit2(),
							authoritySeq: undefined,
						},
					]);
					const plainMs = performance.now() - plainStart;
					const foldStart = performance.now();
					await store.port.commit([
						{
							kind: 'append',
							id: id3++,
							bytes: edit2(),
							authoritySeq: undefined,
						},
					]);
					const foldMs = performance.now() - foldStart;
					store.close();
					say(
						`  ${`${(size2 / 1024).toFixed(0)} KB`.padStart(8)}   ${ms(foldMs).padStart(14)}   ${ms(plainMs).padStart(13)}`,
					);
				}
			}
			async function main() {
				say('# openIdbBacking, measured directly');
				await batching();
				await ackWidth();
				await openCost();
				await foldCost();
				say(`
DONE`);
			}
			main().catch((cause) => {
				say(`
FAILED: ${String(cause)}`);
			});
		</script>
	</body>
