[package]
name = "epicenter-standalone"
version = "0.0.1"
description = "Two named roots and one window, for Epicenter's standalone desktop apps"
authors = ["Epicenter"]
repository = "https://github.com/EpicenterHQ/epicenter"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
# Compares the Epicenter folder with where Open with points, links resolved.
dunce = "1"
log = "0.4"
# Reads the environment from the configuration's `plugins` block.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2.12"
tauri-plugin-dialog = "2.7"
tauri-plugin-epicenter-folder = { path = "../tauri-plugin-epicenter-folder" }

[dev-dependencies]
tauri = { version = "2.12", features = ["test"] }
tempfile = "3.8"
