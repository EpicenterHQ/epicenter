[package]
name = "capture"
version = "0.0.1"
description = "Capture as a desktop window over the folder it keeps its files in"
authors = ["Epicenter"]
repository = "https://github.com/EpicenterHQ/epicenter"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
epicenter-standalone = { path = "../../../packages/tauri-epicenter-standalone" }
tauri = { version = "2.12", features = [] }
# tauri-build finds plugin permissions only through direct dependencies.
tauri-plugin-dialog = "2.7"
tauri-plugin-epicenter-folder = { path = "../../../packages/tauri-plugin-epicenter-folder" }
# `generate_context!` writes the configuration's `plugins` block (the fs
# scope's `scopeDroppedPaths`) as `serde_json` values in the app's own crate.
serde_json = "1"

[dev-dependencies]
# The mock runtime drives the real commands in tests.
tauri = { version = "2.12", features = ["test"] }
