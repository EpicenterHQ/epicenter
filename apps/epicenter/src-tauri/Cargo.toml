[package]
name = "epicenter"
version = "0.0.1"
description = "The Epicenter desktop app: registers, syncs, and shares folders"
authors = ["Epicenter"]
repository = "https://github.com/EpicenterHQ/epicenter"
edition = "2021"

[package.metadata]
cargo-target-macos-version = "10.15"

[lib]
name = "epicenter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
epicenter-transcription-build = { path = "../../../packages/epicenter-transcription-build" }
tauri-build = { version = "2.6", features = [] }

[features]
# Native dictation: paste at the cursor and its Accessibility-grant watch,
# pausing other apps' media, the macOS recording overlay panel, and the
# clipboard-manager and global-shortcut plugins. No page reaches any of it, and
# the page API only grows once released, so the default build compiles none of
# it until a native API decision grants it (ADR-0555).
dictation = [
    "dep:enigo",
    "dep:tauri-plugin-clipboard-manager",
    "dep:tauri-plugin-global-shortcut",
    "dep:accessibility-sys",
    "dep:core-foundation-sys",
    "dep:core-foundation",
    "dep:core-graphics",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
    "dep:tauri-nspanel",
    "dep:windows",
    "dep:zbus",
]

[dev-dependencies]
# The mock runtime verifies native path selection for both bundled identities.
# Test builds only: these features do not enter the shipped binary.
tauri = { version = "2.12", features = ["test"] }

[dependencies]
dunce = "1"
tauri-plugin-dialog = "2.7"
tauri-plugin-epicenter-folder = { path = "../../../packages/tauri-plugin-epicenter-folder" }
epicenter-standalone = { path = "../../../packages/tauri-epicenter-standalone" }
# Settings' local model administration, and the model cache dictation prewarms.
tauri-plugin-epicenter-transcription = { path = "../../../packages/tauri-plugin-epicenter-transcription" }
anyhow = "1"
base64 = "0.22"
enigo = { version = "0.5.0", optional = true }
log = "0.4"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
specta = "=2.0.0-rc.26"
specta-typescript = "=0.0.13"
tauri = { version = "2.12", features = ["macos-private-api", "image-png", "tray-icon"] }
tauri-specta = { git = "https://github.com/specta-rs/tauri-specta", rev = "0922b06408f9dc9ed443589639b067adcef62ba4", features = ["derive", "typescript"] }
tauri-plugin-clipboard-manager = { version = "2", optional = true }
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = { version = "2", optional = true }
tauri-plugin-log = "2"
tauri-plugin-opener = "2.5"
tauri-plugin-updater = "=2.14.0"
tempfile = "3.8"
tokio = { version = "1", features = ["full"] }
# A direct dependency gives this final app's build script the
# DEP_TRANSCRIBE_CPP_* metadata `epicenter_transcription_build` reads.
transcribe-cpp = { version = "0.1.0", default-features = false }

[target.'cfg(unix)'.dependencies]
# Ends a window's `epicenter` children with their process groups (`history.rs`).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = ["Media_Control", "Foundation", "Foundation_Collections", "Win32_System_Com"] }

[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = { version = "0.1.3", optional = true }
core-foundation-sys = { version = "0.8.7", optional = true }
core-foundation = { version = "0.9", optional = true }
core-graphics = { version = "0.22", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "NSString", "NSData", "NSArray"] }
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "a3122e894383aa068ec5365a42994e3ac94ba1b6", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", optional = true, default-features = false, features = ["tokio"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2.4", features = ["deep-link"] }

[profile.dev]
incremental = true

[profile.release]
panic = "abort"
strip = true

[patch.crates-io]
specta = { git = "https://github.com/specta-rs/specta", rev = "3c535739ea7bd8737ecdbff6c3aef9b7330da706" }
specta-macros = { git = "https://github.com/specta-rs/specta", rev = "3c535739ea7bd8737ecdbff6c3aef9b7330da706" }
specta-serde = { git = "https://github.com/specta-rs/specta", rev = "3c535739ea7bd8737ecdbff6c3aef9b7330da706" }
specta-typescript = { git = "https://github.com/specta-rs/specta", rev = "3c535739ea7bd8737ecdbff6c3aef9b7330da706" }
specta-util = { git = "https://github.com/specta-rs/specta", rev = "3c535739ea7bd8737ecdbff6c3aef9b7330da706" }
