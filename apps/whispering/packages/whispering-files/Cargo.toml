[package]
name = "whispering-files"
version = "0.0.1"
description = "How Whispering writes its folder: the plain-name path rule its shell and its recorder share, and the write beside a target its shell makes"
authors = ["Epicenter"]
repository = "https://github.com/EpicenterHQ/epicenter"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "whispering_files"

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }

# An exclusive rename, so a folder move never replaces a file (`beside.rs`).
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = "1"
tempfile = "3.8"
