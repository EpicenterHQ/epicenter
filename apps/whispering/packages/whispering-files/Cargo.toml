[package]
name = "whispering-files"
version = "0.0.1"
description = "How a file reaches Whispering's folder: the plain-name path rule and the one place step its shell and its recorder share"
authors = ["Epicenter"]
repository = "https://github.com/EpicenterHQ/epicenter"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "whispering_files"

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }

# An exclusive rename, so a placed take never replaces a file (`place.rs`).
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = "1"
tempfile = "3.8"
