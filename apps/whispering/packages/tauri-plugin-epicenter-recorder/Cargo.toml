[package]
name = "tauri-plugin-epicenter-recorder"
version = "0.0.1"
description = "Whispering's microphone recorder, which writes a take from the moment it starts and places it in its folder at Stop"
authors = ["Epicenter"]
repository = "https://github.com/EpicenterHQ/epicenter"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
links = "tauri-plugin-epicenter-recorder"


[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
# The folder a take is placed in must be in the app's file system scope.
tauri-plugin-fs = "2.4"
# The path rule and the one place step the shell's file commands share.
whispering-files = { path = "../whispering-files" }
cpal = "0.18.1"
# Encodes a recording to Opus as it records (`opus.rs`); the same libopus the
# transcription plugin decodes with, built from source (`.cargo/config.toml`).
audiopus = "0.3.0-rc.0"
# Converts the microphone's own rate to the recording's 16 kHz; the shell's decoder uses the same crate.
rubato = "0.15"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = "=2.0.0-rc.26"
specta-typescript = "=0.0.13"
tauri = "2.12"
tauri-specta = { git = "https://github.com/specta-rs/tauri-specta", rev = "0922b06408f9dc9ed443589639b067adcef62ba4", features = ["derive", "typescript"] }
thiserror = "2.0.12"

# Microphone access: `permission.rs` reads and requests it through AVFoundation.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }

[dev-dependencies]
tempfile = "3.8"
# The decoder a recording is transcribed with, to check what the encoder wrote.
tauri-plugin-epicenter-transcription = { path = "../transcription" }
# The mock runtime drives the real invoke handler in tests. Test builds only.
tauri = { version = "2.12", features = ["test"] }
