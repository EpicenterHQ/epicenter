[package]
name = "whispering"
version = "7.11.1"
description = "The Whispering desktop shell"
authors = ["Epicenter"]
repository = "https://github.com/EpicenterHQ/epicenter"
edition = "2021"

[package.metadata]
cargo-target-macos-version = "10.15"

[lib]
name = "whispering_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dev-dependencies]
# The mock runtime drives the real invoke handler to check which window and
# origin reach the folder. Test builds only.
tauri = { version = "2.11", features = ["test"] }

[dependencies]
getrandom = "0.3"
serde_json = "1"
tauri = { version = "2.11", features = [] }
tauri-plugin-epicenter-folder = { path = "../../../packages/tauri-plugin-epicenter-folder" }

# The same pins as packages/tauri-plugin-epicenter-folder/Cargo.toml. A patch
# applies only from the crate being built, so a shell that depends on the
# plugin carries its own copy.
[patch.crates-io]
specta = { git = "https://github.com/specta-rs/specta", rev = "3c535739ea7bd8737ecdbff6c3aef9b7330da706" }
specta-macros = { git = "https://github.com/specta-rs/specta", rev = "3c535739ea7bd8737ecdbff6c3aef9b7330da706" }
specta-serde = { git = "https://github.com/specta-rs/specta", rev = "3c535739ea7bd8737ecdbff6c3aef9b7330da706" }
specta-typescript = { git = "https://github.com/specta-rs/specta", rev = "3c535739ea7bd8737ecdbff6c3aef9b7330da706" }
specta-util = { git = "https://github.com/specta-rs/specta", rev = "3c535739ea7bd8737ecdbff6c3aef9b7330da706" }

[profile.dev]
incremental = true

[profile.release]
panic = "abort"
strip = true
