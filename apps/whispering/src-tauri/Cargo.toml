[package]
name = "whispering"
version = "7.11.1"
description = "Whispering as a desktop window over the folder it keeps its recordings in, recorded into from the first sample"
authors = ["Epicenter"]
repository = "https://github.com/EpicenterHQ/epicenter"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[build-dependencies]
epicenter-transcription-build = { path = "../packages/epicenter-transcription-build" }
tauri-build = { version = "2.6", features = [] }

[dependencies]
# Provider API keys, as Keychain items (`secrets.rs`).
keyring = "4.2"
# Decodes the folder and path a raw write carries in its headers (`files.rs`).
percent-encoding = "2.3"
# `generate_context!` writes the configuration's `plugins` block as
# `serde_json` values in the app's own crate, and the tests read the
# configuration with it.
serde_json = "1"
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.7"
tauri-plugin-epicenter-recorder = { path = "../packages/tauri-plugin-epicenter-recorder" }
tauri-plugin-epicenter-transcription = { path = "../packages/transcription" }
tauri-plugin-fs = "2.4"
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-http = "2.5"
tauri-plugin-opener = "2.5"
tauri-plugin-persisted-scope = "2.3"
tauri-plugin-single-instance = "2.3"
# The path rule the file commands and the recorder share, and the write
# beside a target the file commands make.
whispering-files = { path = "../packages/whispering-files" }
# A direct dependency gives this final app's build script the
# DEP_TRANSCRIBE_CPP_* metadata `epicenter_transcription_build` reads.
transcribe-cpp = { version = "0.1.0", default-features = false }

[dev-dependencies]
tempfile = "3.8"
# The mock runtime drives the real commands in tests.
tauri = { version = "2.12", features = ["test"] }
