<!doctype html>
<html lang="en" class="dark" style="color-scheme: dark">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Skills Editor</title>
		<!--
			Undoes the dark default before paint for whoever chose light.
			ModeWatcher ships this same script but injects it through
			`svelte:head`, which arrives after first paint because this app sets
			`ssr = false`. Only `light` is tested: `toggleMode` writes `light` or
			`dark`, and nothing calls `resetMode`, so `system` is never stored.
		-->
		<script>
			if (localStorage.getItem('mode-watcher-mode') === 'light') {
				document.documentElement.classList.remove('dark');
				document.documentElement.style.colorScheme = 'light';
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
