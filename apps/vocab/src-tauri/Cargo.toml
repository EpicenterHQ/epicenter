[package]
name = "vocab"
version = "0.0.2"
description = "Vocab as a desktop program over a folder it owns"
authors = ["Epicenter"]
repository = "https://github.com/EpicenterHQ/epicenter"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "vocab_lib"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
epicenter-standalone = { path = "../../../packages/tauri-epicenter-standalone" }
# tauri-build discovers plugin permissions through DEP_*_PERMISSION_FILES_PATH,
# which Cargo passes only to direct dependents.
tauri-plugin-epicenter-folder = { path = "../../../packages/tauri-plugin-epicenter-folder" }
tauri-plugin-dialog = "2.7"
# Opens the sign-in page in the system browser, from Rust only (no plugin).
tauri-plugin-opener = "2.5"
tauri = { version = "2.12", features = [] }
# The OS keychain, as Epicenter's shell used it (main's `keyring_storage.rs`).
keyring = "4"
# Sign-in with Epicenter for hosted models, and the account's requests.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
tokio = { version = "1", features = ["rt", "sync", "net", "io-util", "time"] }

[dev-dependencies]
tauri = { version = "2.12", features = ["test"] }
