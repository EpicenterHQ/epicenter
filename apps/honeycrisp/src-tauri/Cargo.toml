[package]
name = "honeycrisp"
version = "0.0.1"
description = "Honeycrisp desktop shell"
authors = ["Epicenter"]
repository = "https://github.com/EpicenterHQ/epicenter"
edition = "2021"

[lib]
name = "honeycrisp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The folder's path rule and root resolution, shared with the folder plugin.
epicenter-folder-core = { path = "../../../packages/tauri-plugin-epicenter-folder/core" }
serde = { version = "1", features = ["derive"] }
# The generated context carries the fs plugin's configuration as JSON.
serde_json = "1"
tauri = { version = "2.11", features = [] }
tauri-plugin-epicenter-folder = { path = "../../../packages/tauri-plugin-epicenter-folder" }
# The page reads its granted folder through the fs plugin's commands.
tauri-plugin-fs = "2"

[dev-dependencies]
# The mock runtime drives the real invoke handler in tests. Test builds only.
tauri = { version = "2.11", features = ["test"] }

# The same pins as packages/tauri-plugin-epicenter-folder/Cargo.toml; a shell
# that depends on the plugin carries its own copy.
[patch.crates-io]
specta = { git = "https://github.com/specta-rs/specta", rev = "3c535739ea7bd8737ecdbff6c3aef9b7330da706" }
specta-macros = { git = "https://github.com/specta-rs/specta", rev = "3c535739ea7bd8737ecdbff6c3aef9b7330da706" }
specta-serde = { git = "https://github.com/specta-rs/specta", rev = "3c535739ea7bd8737ecdbff6c3aef9b7330da706" }
specta-typescript = { git = "https://github.com/specta-rs/specta", rev = "3c535739ea7bd8737ecdbff6c3aef9b7330da706" }
specta-util = { git = "https://github.com/specta-rs/specta", rev = "3c535739ea7bd8737ecdbff6c3aef9b7330da706" }

# Drives the close gate from the page client's tests. Not part of the app.
[[example]]
name = "harness"

# Quits the real app through AppKit's terminate: on a fixture page, in a fresh
# folder. macOS only; opens a window. Not part of the app.
[[example]]
name = "quit"
path = "examples/quit/main.rs"

[profile.release]
panic = "abort"
strip = true
