name: Prepare CLI release

on:
  push:
    tags: ['epicenter-cli-v*']
  workflow_dispatch:
    inputs:
      verify-published:
        description: Also try this version's public release downloads without credentials
        type: boolean
        default: false

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Check native target and release tag
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          bun -e 'if (`${process.platform}-${process.arch}` !== process.env.EXPECTED_TARGET) throw new Error("Runner architecture does not match target"); const version = (await Bun.file("packages/cli/package.json").json()).version; if (process.env.GITHUB_REF_TYPE === "tag" && process.env.GITHUB_REF_NAME !== `epicenter-cli-v${version}`) throw new Error("Tag does not match CLI version");'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check CLI and writing behavior
        run: |
          bun run --cwd packages/cli typecheck
          bun test packages/cli/src/writing.test.ts packages/cli/src/installer.test.ts
      - name: Build native executable and installer
        env:
          TARGET: ${{ matrix.target }}
        run: bun run --cwd packages/cli release --target "$TARGET"
      - name: Verify macOS signature
        if: runner.os == 'macOS'
        run: codesign --verify packages/cli/dist/release/epicenter-${{ matrix.target }}
      - name: Try onboarding in a fresh home
        env:
          EPICENTER_SMOKE_SOURCE: file://${{ github.workspace }}#examples/writing
        run: bun packages/cli/scripts/smoke-release.ts packages/cli/dist/release "$EPICENTER_SMOKE_SOURCE"
      - name: Try the published installer without credentials
        if: inputs.verify-published
        run: |
          version=$(bun -e 'console.log((await Bun.file("packages/cli/package.json").json()).version)')
          bun packages/cli/scripts/smoke-release.ts packages/cli/dist/release 'https://github.com/EpicenterHQ/epicenter#examples/writing' "https://github.com/EpicenterHQ/epicenter/releases/download/epicenter-cli-v$version"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: packages/cli/dist/release/*
          if-no-files-found: error

  draft:
    if: startsWith(github.ref, 'refs/tags/epicenter-cli-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets
      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sed "s/__RELEASE_TAG__/$RELEASE_TAG/g" packages/cli/release-notes.md > release-notes.md
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Try Writing from the public default branch before creating the draft
        run: bun packages/cli/scripts/smoke-release.ts release-assets 'https://github.com/EpicenterHQ/epicenter#examples/writing'
      - name: Create draft with verified downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease --latest=false --title "Epicenter CLI ${RELEASE_TAG#epicenter-cli-}" --notes-file release-notes.md
