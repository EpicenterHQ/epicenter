# The authoritative merge gate. `bun run check` is the same gate locally, so a
# green local run predicts a green PR; this job exists to run it on hardware
# nobody can forget to use.
#
# The workflow invokes that script directly, so the local and hosted gates
# cannot drift.
#
# Deliberately NOT in this gate:
#   - Formatting. ci.autofix.yml runs `bun run format` and pushes the fix, so
#     failing here would only tell a contributor what a bot is already doing.
#     `bun run check` still runs `format:check` locally, before the push.
#   - `bun run check:doc-hygiene`. Its ADR-staleness rule is time-based, so a
#     PR that touched nothing can go red on a calendar day. It stays an explicit
#     review command (see 91c4a87c1b), not a merge blocker.
#   - Runtime parity and Gmail drift. Those need Docker, a Postgres service,
#     S3, or a live Google endpoint; they keep their own workflows on their
#     own triggers.
#
# The gate's tests do need two local programs, which this job installs:
#   - PostgreSQL's initdb and pg_ctl. The session handoff tests in
#     packages/server start their own disposable cluster on a loopback port.
#   - Playwright's Chromium. The self-host lifecycle test plays a stored blob
#     in a real browser.
name: Code quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: 'package.json'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Put PostgreSQL's server programs on PATH
        # Ubuntu installs initdb and pg_ctl under /usr/lib/postgresql/<major>/bin,
        # off PATH. Use the newest one the image has, or install it.
        run: |
          bin=$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$bin" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql
            bin=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -n 1)
          fi
          echo "$bin" >> "$GITHUB_PATH"
      - name: Install the tests' Chromium
        # From a package that depends on Playwright, so the browser matches the
        # locked version.
        working-directory: packages/ui
        run: bun x playwright install --with-deps --only-shell chromium
      - name: Canonical gate
        run: bun run check
