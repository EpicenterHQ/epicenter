name: Build Epicenter release draft
on:
  push:
    tags: ['epicenter-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Epicenter release tag to build
        required: true
        type: string
permissions:
  contents: read
concurrency:
  # Share the publication queue so a draft retry cannot overwrite assets
  # between the publisher's validation and its public release transition.
  group: epicenter-stable-release
  cancel-in-progress: false
  queue: max
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Prepare one private draft for both builds
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[]' | jq -s --arg tag "$RELEASE_TAG" '[.[] | select(.tag_name == $tag)]' > "$RUNNER_TEMP/releases.json"
          count="$(jq length "$RUNNER_TEMP/releases.json")"
          if [ "$count" = 0 ]; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Epicenter ${RELEASE_TAG#epicenter-v}" --notes "Internal build in progress. Do not publish."
          else
            jq -e 'length == 1 and .[0].draft == true' "$RUNNER_TEMP/releases.json"
            if jq -e '.[0].assets | any(.name == "stable.json")' "$RUNNER_TEMP/releases.json"; then
              gh release delete-asset "$RELEASE_TAG" stable.json --yes
            fi
            gh release edit "$RELEASE_TAG" --notes "Internal build in progress. Do not publish."
          fi
  build:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-aarch64
          - runner: macos-15-intel
            target: darwin-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: dtolnay/rust-toolchain@stable
      - run: bun install --frozen-lockfile
      - name: Import distribution certificate into a temporary keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/epicenter.p12"
          keychain="$RUNNER_TEMP/epicenter.keychain-db"
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$password" "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security set-keychain-settings -t 7200 -u "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          rm "$certificate"
      - name: Build signed and notarized Epicenter
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          EPICENTER_UPDATER_PUBLIC_KEY: ${{ vars.EPICENTER_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.EPICENTER_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.EPICENTER_UPDATER_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bun run --cwd apps/epicenter release:build "$RELEASE_TAG" "$GITHUB_WORKSPACE/.artifacts/release/${{ matrix.target }}"
      # Actions artifacts in a public repository are readable by repository
      # readers. Transfer these internal binaries through the draft instead.
      - name: Upload signed files to the private draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # A partial rerun must not replace files under a completed manifest.
          # Re-run all jobs to let prepare remove that completion marker first.
          gh release view "$RELEASE_TAG" --json isDraft,assets | jq -e '.isDraft == true and all(.assets[]; .name != "stable.json")'
          directory=".artifacts/release/$RELEASE_TARGET"
          gh release upload "$RELEASE_TAG" "$directory"/*.dmg "$directory"/*.tar.gz "$directory"/*.sig --clobber
          cp "$directory/part.json" "$directory/$RELEASE_TARGET.part.json"
          gh release upload "$RELEASE_TAG" "$directory/$RELEASE_TARGET.part.json" --clobber
      - name: Remove temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/epicenter.keychain-db" || true
  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Verify draft assets and complete its feed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          bun apps/epicenter/scripts/release.ts collect-draft "$RELEASE_TAG" .artifacts/release
          gh release upload "$RELEASE_TAG" .artifacts/release/stable.json --clobber
          gh release edit "$RELEASE_TAG" --notes "Signed and notarized internal Epicenter development build. Review the bundled apps before publication."
