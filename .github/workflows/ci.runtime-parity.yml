# Runtime-parity regression gate for the apps/api runtime port (ADR-0059).
#
# Boots the Bun runtime port (apps/api/server.dev.ts) against plain Postgres and
# its local record directory, then runs the one-scenario smoke
# (apps/api/scripts/smoke.ts). A non-zero smoke exit fails the job.
#
# No real secrets, OAuth, or JWKS are needed: the smoke wrapper starts the
# server with the dev resolver (server.dev.ts), which resolves `Authorization:
# Bearer dev:<userId>` to a synthetic user on localhost and fills fake auth env
# values only where this job has not supplied them.
#
# Scope: this proves LOGIC parity (the same Hono app over injected runtime
# hooks). It does NOT prove TRANSPORT parity: `Bun.serve` vs workerd, and the
# WebSocket upgrade path, only differ under wrangler. Catching that skew needs
# `wrangler dev` against real Cloudflare bindings, which stays a manual / staging
# step (it needs Infisical secrets this gate deliberately avoids).

name: Runtime parity

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bun-smoke:
    # GitHub-hosted runner with one Postgres service for hosted auth boot.
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: epicenter
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/epicenter

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: 'package.json'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply database schema
        # The server boots without a schema (the room telemetry upsert is
        # fire-and-forget), but applying the committed migration keeps the gate
        # honest and quiet. Drizzle reads DATABASE_URL from the job env.
        working-directory: apps/api
        run: bun x drizzle-kit migrate

      - name: Run runtime-parity smoke (Bun)
        run: bun apps/api/scripts/smoke-local.ts
