# Runtime-parity gate for apps/api's two entries (ADR-0059, ADR-0549).
#
# Runs apps/api/oauth-server.postgres.test.ts with a real S3 store (versitygw,
# the same store dev uses). That test boots `bun server.ts` and the Worker under
# `wrangler dev --local` against disposable Postgres clusters, mints real OAuth
# access tokens, and drives each entry's resources over HTTP. The merge gate
# runs the same test without object storage; this job adds the Bun entry's
# personal blob round trip, which needs Docker. The Worker fetches only public
# addresses, so it cannot reach a local store.
#
# No real secrets or provider credentials are needed: the test signs its own
# sessions with a fixture secret and issues tokens through the authorization
# server itself.

name: Runtime parity

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  entries:
    # GitHub-hosted runner: this job needs Docker Compose v2 and the AWS CLI
    # (both preinstalled here). It can move to the repo's Blacksmith runner if
    # that image carries the same tools.
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      # Point the portable S3 client at the local versitygw store (below).
      BLOBS_S3_ENDPOINT: http://localhost:7070
      BLOBS_S3_ACCESS_KEY_ID: epicenter-local
      BLOBS_S3_SECRET_ACCESS_KEY: epicenter-local-secret
      BLOBS_S3_BUCKET: epicenter-blobs
      BLOBS_S3_REGION: us-east-1

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: 'package.json'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Put PostgreSQL's server programs on PATH
        # The test starts its own disposable clusters with initdb and pg_ctl,
        # which Ubuntu installs under /usr/lib/postgresql/<major>/bin, off PATH.
        run: |
          bin=$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$bin" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql
            bin=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -n 1)
          fi
          echo "$bin" >> "$GITHUB_PATH"

      - name: Start local S3 (versitygw) and create the bucket
        # Reuses the exact compose file dev and self-host use, so the CI store is
        # the same artifact (versitygw over a folder) and the bucket-creation
        # one-shot runs unchanged. Poll until the bucket exists before the test,
        # because the blob store never calls CreateBucket.
        working-directory: apps/api
        env:
          AWS_ACCESS_KEY_ID: epicenter-local
          AWS_SECRET_ACCESS_KEY: epicenter-local-secret
          AWS_DEFAULT_REGION: us-east-1
        run: |
          docker compose up -d
          for i in $(seq 1 30); do
            if aws --endpoint-url http://localhost:7070 s3 ls s3://epicenter-blobs >/dev/null 2>&1; then
              echo "versitygw ready, bucket epicenter-blobs exists"
              exit 0
            fi
            echo "waiting for versitygw + bucket ($i)..."
            sleep 2
          done
          echo "::error::versitygw / bucket not ready after 60s"
          docker compose logs
          exit 1

      - name: Run both entries with real access tokens and object storage
        working-directory: apps/api
        run: bun test oauth-server.postgres.test.ts

      - name: Stop local S3
        if: always()
        working-directory: apps/api
        run: docker compose down -v
