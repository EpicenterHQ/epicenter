<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
	<title>Epicenter</title>
	<!-- Epicenter mark: two overlapping circles, transparent background. -->
	<!-- The other SVGs in this folder are this mark plus a backdrop or the name. -->
	<!-- Apps keep hand-edited copies (e.g. apps/landing/public/favicon.svg). -->
	<!-- Gray circle is drawn first so the white circle overlaps in front. -->
	<circle cx="170" cy="170" r="100" fill="#cccccc" />
	<circle cx="230" cy="230" r="100" fill="#ffffff" />
</svg>
